[project]
name = "kata-projects"
version = "0.1.0"
description = "Curated collection of code katas for practice"
readme = "README.md"
license = {text = "CC0-1.0"}
authors = [{name = "kata-projects contributors"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20"]
ignore = []

# Each kata module ships a runnable `if __name__ == "__main__":` demo, which is
# the kata's user-facing output (T201 = print found). Kata directories are
# declared as their own ruff source roots so the exception stays scoped to the
# kata modules and does not leak into the wider tree.
[tool.ruff.lint.per-file-ignores]
"*/kata*/kata*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false